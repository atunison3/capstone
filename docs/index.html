<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

    <!-- Core Theme -->
    <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@5/dist/themes/core.min.css">
  </head>
  <body class="loading">
    <div id="app"></div>

    <!-- Configuration -->
    <script>
    window.$docsify = {
        name: 'Capstone',
        repo: 'https://github.com/atunison3/capstone',
        loadSidebar: true,
        coverpage: true,        // ← enable the cover page
        // or: coverpage: '_coverpage.md',
        onlyCover: false,       // false = show cover + allow navigation into the site
        // onlyCover: true,     // true = only show the cover page (no sidebar until clicked)
    }
    </script>
    <script>
    window.$docsify = {
        name: 'Capstone',
        repo: 'https://github.com/atunison3/capstone',
        loadSidebar: true,
        coverpage: true,
        themeColor: '#FFCB05',   // maize accent
        auto2top: true,
        search: 'auto'
    }
    </script>

    <!-- Docsify.js -->
    <script src="//cdn.jsdelivr.net/npm/docsify@5"></script>

    <!-- Plugins (optional) -->
    <!-- <script src="//cdn.jsdelivr.net/npm/docsify@5/dist/plugins/search.min.js"></script> -->
  </body>
</html>
